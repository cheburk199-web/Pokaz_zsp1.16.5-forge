name: Build Spawner Tooltip Forge 1.16.5
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - uses: gradle/actions/setup-gradle@v3
      - name: Install Gradle 7.3.3
        run: |
          curl -L https://services.gradle.org/distributions/gradle-7.3.3-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$HOME"
      - name: Build mod
        run: "$HOME/gradle-7.3.3/bin/gradle --no-daemon build"
      - uses: actions/upload-artifact@v4
        with:
          name: spawner-tooltip-forge-1165
          path: build/libs/*.jar
